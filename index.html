<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Serverless Cloud Computing</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f0f2f5; }
        .card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #ff9900; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #e68a00; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Kalkulator Cloud</h2>
        <input type="number" id="a" placeholder="Angka 1"> 
        <input type="number" id="b" placeholder="Angka 2">
        <button onclick="hitung()">Hitung</button>
        <h3 id="hasil">Hasil: -</h3>
    </div>

    <script>
        async function hitung() {
            // 1. GANTI URL DI BAWAH INI DENGAN LAMBDA URL PUNYA KAMU SENDIRI!
            const LAMBDA_URL = "ISI_URL_LAMBDA_KAMU_DISINI";

            const a = parseInt(document.getElementById('a').value);
            const b = parseInt(document.getElementById('b').value);

            if (isNaN(a) || isNaN(b)) {
                alert("Masukkan angka yang valid!");
                return;
            }
            
            const url = `${LAMBDA_URL}?a=${a}&b=${b}`;
            
            try {
                document.getElementById('hasil').innerText = "Menghitung...";
                const response = await fetch(url);
                const data = await response.json();
                document.getElementById('hasil').innerText = "Hasil: " + data.hasil;
            } catch (error) {
                document.getElementById('hasil').innerText = "Error! Cek URL di kodingan.";
                console.error("Error:", error);
            }
        }
    </script>
</body>
</html>
